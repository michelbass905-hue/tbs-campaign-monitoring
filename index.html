<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TBS SARL – Campaign Monitoring</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.78.0/dist/umd/supabase.js"></script><script src="config.js"></script>
<style>
:root{--bg:#f2f5f9;--cd:#fff;--tx:#18212f;--mu:#667085;--bd:#e3e7ee;--ac:#0b7a6b;--er:#b42318;--wa:#b54708;--sh:0 1px 2px rgba(16,24,40,.06),0 6px 18px rgba(16,24,40,.06);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141b;--cd:#18202a;--tx:#e8ecf1;--mu:#9aa5b5;--bd:#2a3442;--ac:#2fb5a2;--er:#f97066;--wa:#fdb022;--sh:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f141b;--cd:#18202a;--tx:#e8ecf1;--mu:#9aa5b5;--bd:#2a3442;--ac:#2fb5a2;--er:#f97066;--wa:#fdb022;--sh:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:980px;margin:0 auto;padding:12px}
h1{font-size:18px;margin:0;line-height:1.2}h2{font-size:17px;margin:0 0 8px}h3{font-size:15px;margin:14px 0 6px}
.top{background:linear-gradient(135deg,#0b7a6b,#0e4f7a);color:#fff;border-radius:16px;padding:14px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px;box-shadow:var(--sh)}
.top .sub{color:rgba(255,255,255,.8)}.brand{display:flex;gap:12px;align-items:center}
.logo{width:48px;height:48px;border-radius:50%;background:#fff;display:grid;place-items:center;overflow:hidden}.logo img{width:100%;height:100%;object-fit:contain}
.sub{color:var(--mu);font-size:12px}
nav{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
nav button,.b{border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:10px;padding:9px 14px;font:inherit;cursor:pointer;white-space:nowrap;box-shadow:var(--sh)}
nav button.on,.b.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.top .b{background:rgba(255,255,255,.16);color:#fff;border-color:rgba(255,255,255,.3);box-shadow:none;padding:5px 10px;font-size:13px}
.b.d{color:var(--er);border-color:var(--er)}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}
.kp div{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:10px 14px;box-shadow:var(--sh)}.kp b{display:block;font-size:24px;color:var(--ac)}.kp span{font-size:12px;color:var(--mu)}
label{display:block;font-size:12px;font-weight:600;color:var(--mu);margin-bottom:3px}
input,select,textarea{width:100%;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:10px;padding:10px;font:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:0}textarea{min-height:70px}
.er input,.er select,.er textarea{border-color:var(--er)}
.ch{display:inline-block;font-size:11px;font-weight:600;border-radius:99px;padding:2px 10px;color:var(--c,var(--mu));background:color-mix(in srgb,var(--c,var(--mu)) 15%,transparent)}
.s-Planned{--c:#3b82f6}.s-Running{--c:#16a34a}.s-Completed{--c:#64748b}.s-Paused{--c:#d97706}
.na{color:var(--wa);font-style:italic}
.it{cursor:pointer;transition:transform .12s,border-color .12s}.it:hover{border-color:var(--ac);transform:translateY(-1px)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.msg{border:1px solid var(--er);color:var(--er);border-radius:10px;padding:8px 12px;margin-bottom:10px}.msg ul{margin:4px 0 0;padding-left:18px}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-weight:600}
dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;margin:0}dt{color:var(--mu)}dd{margin:0}
.hero{max-width:420px;margin:18px auto}.hero .logo{width:120px;height:120px;margin:0 auto 12px;box-shadow:var(--sh);border:1px solid var(--bd)}
.hero h2{text-align:center;font-size:20px}.hero p{text-align:center;color:var(--mu);margin:0 0 14px}
.ft{display:flex;gap:10px;align-items:flex-start;margin:8px 0}.ft i{font-style:normal;font-size:20px}
details{border:1px solid var(--bd);border-radius:12px;padding:10px 14px;margin-bottom:8px;background:var(--cd)}summary{cursor:pointer;font-weight:600}details p,details ul{margin:8px 0 0}
#t{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:10px;display:none;z-index:9}
</style></head><body><div class="w">

function nextId(){const y=new Date().getFullYear(),m=data.filter(c=>c.id.startsWith("CMP-"+y)).map(c=>+c.id.split("-")[2]);return`CMP-${y}-${String(Math.max(0,...m)+1).padStart(3,"0")}`}
function go(v,a){view=v;delArm=null;const items=[["list","Campaigns"],...(can("edit")?[["form","New campaign"]]:[]),["sum","Summary"],["data","Data"],["help","Help"]];

function vList(){const kp=(n,l)=>`<div><b>${n}</b><span>${l}</span></div>`;$("#main").innerHTML=`<div class="kp">${kp(data.length,"Campaigns")}${kp(data.filter(c=>c.status==="Running").length,"Running")}${kp(data.filter(c=>c.status==="Completed").length,"Completed")}${kp(data.filter(c=>c.spend!=null).length,"With results")}</div><div class="cd"><div class="g">
<div><label>Search</label><input id="q" value="${esc(F.q)}" oninput="F.q=this.value;res()"></div>
<div><label>Status</label><select onchange="F.st=this.value;res()">${opts(ST,F.st,1)}</select></div>
<div><label>Objective</label><select onchange="F.ob=this.value;res()">${opts(OBJ,F.ob,1)}</select></div>

function filt(){const l=s=>s.toLowerCase();return data.filter(c=>(!F.q||l(c.name+c.product+c.id).includes(l(F.q)))&&(!F.st||c.status===F.st)&&(!F.ob||c.objective===F.ob)&&(!F.lo||l(c.location).includes(l(F.lo)))&&(!F.to||c.start<=F.to)&&(!F.from||c.end>=F.from))}
function res(){const L=filt();$("#res").innerHTML=(L.length?`<div class="sub" style="margin-bottom:6px">${L.length} campaign(s)</div>`:`<div class="cd sub">No campaigns found. ${can("edit")?"Create one, or ask an administrator to load the B Learnif campaign (Data tab). New here? Open the Help tab.":""}</div>`)+L.map(c=>`<div class="cd it" onclick="go('detail','${c.id}')"><div class="row"><b>${esc(c.name)}</b><span class="ch s-${esc(c.status)}">${esc(c.status)}</span></div><div class="sub">${c.id} · ${esc(c.objective)} · ${esc(c.location)}</div><div>${c.start} → ${c.end} · ${money(c)}</div></div>`).join("")}
function fld(k,l,t,v,x){const a=x||"";const val=v?.[k]??"";if(t==="s")return`<div id="w_${k}"><label>${l}</label><select id="f_${k}">${opts(a,val,1)}</select></div>`;if(t==="a")return`<div id="w_${k}" style="grid-column:1/-1"><label>${l}</label><textarea id="f_${k}">${esc(val)}</textarea></div>`;return`<div id="w_${k}"><label>${l}</label><input id="f_${k}" type="${t}" ${t==="number"?`min="0" step="${a||"any"}"`:""} value="${esc(val)}"></div>`}
function vForm(id){const c=id?data.find(x=>x.id===id):null;$("#main").innerHTML=`<h2>${c?"Edit "+c.id:"New campaign"}</h2><div id="errs"></div>
<div class="cd"><b>Planning</b><div class="g" style="margin-top:8px">${fld("name","Campaign name *","text",c)}${fld("objective","Objective *","s",c,OBJ)}${fld("product","Product / service *","text",c)}${fld("status","Status","s",c,ST)}${fld("start","Start date *","date",c)}${fld("end","End date *","date",c)}${fld("location","Target location *","text",c)}${fld("audience","Audience description *","a",c)}</div></div>
<div class="cd"><b>Budget</b><div class="g" style="margin-top:8px">${fld("budget","Planned budget *","number",c)}${fld("currency","Currency *","s",c,CUR)}${fld("period","Budget period *","s",c,PER)}${fld("spend","Verified actual spend","number",c)}</div></div>
<div class="cd"><b>Verified results</b><div class="sub">Leave a field empty if the value was not collected: an empty value is never converted to zero.</div><div class="g" style="margin-top:8px">${MET.map(m=>fld(m[0],m[1],"number",c,"1")).join("")}${fld("rStart","Reporting period: start","date",c)}${fld("rEnd","Reporting period: end","date",c)}${fld("source","Data source (e.g. Ads Manager export of dd/mm)","text",c)}${fld("notes","Observations and lessons learned","a",c)}</div></div>
<div class="row"><button class="b" onclick="go('${c?"detail":"list"}'${c?",'"+c.id+"'":""})">Cancel</button><button class="b p" onclick="submit('${id||""}')">Save</button></div>`}
const num=k=>{const s=$("#f_"+k).value.trim();return s===""?null:Number(s)};
async function submit(id){const g=k=>$("#f_"+k).value.trim();const v={};["name","objective","product","status","start","end","location","audience","currency","period","rStart","rEnd","source","notes"].forEach(k=>v[k]=g(k));
["budget","spend",...MET.map(m=>m[0])].forEach(k=>v[k]=num(k));if(!v.status)v.status="Planned";
const e=[],bad=[];const R=[["name","Campaign name"],["objective","Objective"],["product","Product/service"],["start","Start date"],["end","End date"],["location","Target location"],["audience","Audience description"],["budget","Planned budget"],["currency","Currency"],["period","Budget period"]];
R.forEach(([k,l])=>{if(v[k]===""||v[k]==null){e.push(l+" is required.");bad.push(k)}});
if(v.start&&v.end&&v.end<v.start){e.push("The end date cannot be earlier than the start date.");bad.push("end")}
[["budget","Planned budget"],["spend","Actual spend"]].forEach(([k,l])=>{if(v[k]!=null&&(isNaN(v[k])||v[k]<0)){e.push(l+" cannot be negative.");bad.push(k)}});
MET.forEach(([k,l])=>{if(v[k]!=null&&(isNaN(v[k])||v[k]<0||!Number.isInteger(v[k]))){e.push(l+": a whole number of 0 or more is required.");bad.push(k)}});
const has=v.spend!=null||MET.some(m=>v[m[0]]!=null);
if(has&&(!v.rStart||!v.rEnd)){e.push("A reporting period is required whenever spend or a metric is entered.");bad.push("rStart","rEnd")}
if(has&&!v.source){e.push("A data source is required whenever spend or a metric is entered.");bad.push("source")}
if(v.rStart&&v.rEnd&&v.rEnd<v.rStart){e.push("The reporting period ends before it starts.");bad.push("rEnd")}
document.querySelectorAll(".er").forEach(x=>x.classList.remove("er"));
if(e.length){$("#errs").innerHTML=`<div class="msg"><b>Record not saved</b><ul>${e.map(x=>"<li>"+esc(x)+"</li>").join("")}</ul></div>`;bad.forEach(k=>$("#w_"+k)?.classList.add("er"));window.scrollTo(0,0);return}
const r=id?{...data.find(c=>c.id===id),...v}:{...v};
if(!await upsert(r,!id))return;toast("Campaign saved");go("detail",r.id)}
function vDetail(id){const c=data.find(x=>x.id===id);if(!c)return go("list");const r=c.rStart?`${c.rStart} → ${c.rEnd}`:"—";
$("#main").innerHTML=`<div class="row" style="margin-bottom:8px"><h2>${esc(c.name)}</h2><span class="ch s-${esc(c.status)}">${esc(c.status)}</span></div>
<div class="cd"><dl><dt>Campaign ID</dt><dd>${c.id}</dd><dt>Objective</dt><dd>${esc(c.objective)}</dd><dt>Product / service</dt><dd>${esc(c.product)}</dd><dt>Dates</dt><dd>${c.start} → ${c.end}</dd><dt>Target location</dt><dd>${esc(c.location)}</dd><dt>Audience</dt><dd>${esc(c.audience)}</dd><dt>Planned budget</dt><dd>${money(c)}</dd><dt>Actual spend</dt><dd>${c.spend==null?NA:nf(c.spend)+" "+esc(c.currency)}</dd></dl></div>
<div class="cd"><b>Results</b><dl style="margin-top:6px">${MET.map(m=>`<dt>${m[1]}</dt><dd>${nf(c[m[0]])}</dd>`).join("")}<dt>Reporting period</dt><dd>${r}</dd><dt>Source</dt><dd>${esc(c.source)||"—"}</dd></dl></div>
<div class="cd"><b>Observations and lessons learned</b><div>${esc(c.notes)||'<span class="na">No notes</span>'}</div><div class="sub" style="margin-top:8px">Created ${String(c.created).slice(0,10)} · last updated ${String(c.updated).slice(0,16).replace("T"," ")} by ${esc(c.by)||"—"}</div></div>
<div class="row"><button class="b" onclick="go('list')">Back</button><span>${can("edit")?`<button class="b p" onclick="go('form','${c.id}')">Edit</button> `:""}${can("admin")?`<button class="b d" onclick="del('${c.id}')">${delArm===c.id?"Confirm deletion":"Delete"}</button>`:""}</span></div>`}
async function del(id){if(delArm!==id){delArm=id;return vDetail(id)}const{error}=await sb.from("campaigns").delete().eq("id",id);if(error)return toast("Error: "+error.message);await loadAll();toast("Campaign deleted");go("list")}
function vHelp(){$("#main").innerHTML=`<div class="cd"><h2>How this site works</h2><p style="margin:0">This tool helps TBS SARL keep every Facebook and Instagram ad campaign in one shared place: what was planned, what was spent, and what results it brought. Figures are copied by hand from the official Meta reports, so no Meta password is ever needed.</p></div>
<details open><summary>Quick start in 4 steps</summary><ul><li><b>1. New campaign:</b> fill in the name, objective, dates, location, audience and planned budget.</li><li><b>2. Run the ads</b> on Meta as usual.</li><li><b>3. Add the results:</b> open the campaign, tap Edit, and enter spend, reach, clicks… with the reporting period and the source.</li><li><b>4. Compare:</b> use the Summary tab to see totals for any period.</li></ul></details>
<details><summary>Words explained</summary><ul><li><b>Reach:</b> how many different people saw the ad.</li><li><b>Impressions:</b> how many times the ad was shown (one person can see it several times).</li><li><b>Clicks:</b> how many times people tapped the ad.</li><li><b>Messages:</b> conversations started with the business.</li><li><b>Leads:</b> people who left their contact details.</li><li><b>Sales:</b> purchases linked to the campaign.</li></ul></details>
<details><summary>Why “Not collected” and not 0?</summary><p>A zero means “we measured it and nobody clicked”. “Not collected” means “we do not know yet”. Keeping them apart stops the totals from being wrong.</p></details>
<details><summary>Good to know</summary><ul><li>Currencies (XOF, MAD…) are never added together.</li><li>If you enter any result, the reporting period and the source are required.</li><li>An end date cannot be before the start date, and amounts cannot be negative.</li></ul></details>
<details><summary>Who can do what</summary><div class="sc"><table><tr><th>Role</th><th>Can do</th></tr><tr><td>Marketing</td><td>Create and edit campaigns, see summaries</td></tr><tr><td>Manager</td><td>View everything, summaries, exports</td></tr><tr><td>Administrator</td><td>Everything, including delete, restore and the B Learnif example</td></tr></table></div></details>`}
function vSum(){$("#main").innerHTML=`<div class="cd"><div class="g"><div><label>Period: from</label><input id="sf" type="date" onchange="sum()"></div><div><label>to</label><input id="st" type="date" onchange="sum()"></div></div><div class="sub" style="margin-top:6px">A campaign is included if its dates overlap the period. Currencies and budget bases are never added together.</div></div><div id="so"></div>`;sum()}
function summ(){const f=$("#sf")?.value,t=$("#st")?.value,L=data.filter(c=>(!t||c.start<=t)&&(!f||c.end>=f)),B={},S={};
L.forEach(c=>{const k=c.currency+" · "+c.period;(B[k]??={n:0,s:0}).n++;B[k].s+=c.budget||0;if(c.spend!=null){(S[c.currency]??={n:0,s:0}).n++;S[c.currency].s+=c.spend}});
const M=MET.map(([k,l])=>{const x=L.filter(c=>c[k]!=null);return{l,n:x.length,s:x.reduce((a,c)=>a+c[k],0)}});return{L,B,S,M}}
function sum(){const{L,B,S,M}=summ();const T=(h,rows)=>`<div class="cd sc"><table><tr>${h.map(x=>"<th>"+x+"</th>").join("")}</tr>${rows.map(r=>"<tr>"+r.map(x=>"<td>"+x+"</td>").join("")+"</tr>").join("")}</table></div>`;
$("#so").innerHTML=`<div class="cd"><b>${L.length}</b> campaign(s) · ${ST.map(s=>s+": "+L.filter(c=>c.status===s).length).join(" · ")}</div>
<h2>Planned budgets</h2>${T(["Currency · basis","Campaigns","Total planned"],Object.entries(B).map(([k,v])=>[esc(k),v.n,v.s.toLocaleString("en-US")]))}
<h2>Verified actual spend</h2>${T(["Currency","Campaigns with data","Total spent"],Object.entries(S).map(([k,v])=>[k,v.n+" / "+L.filter(c=>c.currency===k).length,v.s.toLocaleString("en-US")]))}
<h2>Results</h2>${T(["Metric","Campaigns with data","Total"],M.map(m=>[m.l,m.n+" / "+L.length,m.n?m.s.toLocaleString("en-US"):NA]))}<div class="sub">Totals ignore values that were not collected. Summed reach may count the same person more than once.</div>`}
const COLS=["id","name","objective","product","status","start","end","location","audience","budget","currency","period","spend",...MET.map(m=>m[0]),"rStart","rEnd","source","notes","created","updated","by"];
const csv=L=>"\ufeff"+[COLS.join(";"),...L.map(c=>COLS.map(k=>{const v=c[k];return v==null?"":'"'+String(v).replace(/"/g,'""')+'"'}).join(";"))].join("\n");
function vData(){$("#main").innerHTML=`<div class="cd"><h2>Backup, export and restore</h2><div class="sub" style="margin-bottom:8px">Data is stored in the Supabase database. Make a dated JSON backup regularly and keep it in an authorized, secure location. Restoring merges the backup’s campaigns into the database.</div>
${can("export")?`<div class="row" style="justify-content:flex-start"><button class="b" onclick="dump('json')">Backup (JSON)</button><button class="b" onclick="dump('csv')">Export CSV (filtered list)</button><button class="b" onclick="copyT()">Copy text</button></div>`:'<div class="sub">Export is available to managers and administrators.</div>'}
<textarea id="tx" style="min-height:160px;margin-top:8px" placeholder="Exported text appears here. To restore, paste a JSON backup."></textarea>
${can("admin")?`<div class="row" style="justify-content:flex-start;margin-top:8px"><button class="b p" onclick="restore()">Restore from pasted text</button><button class="b" onclick="demo()">Load B Learnif campaign</button></div>`:""}</div>`}
function dump(t){const s=t==="json"?JSON.stringify({app:"tbs-campaigns",date:new Date().toISOString(),campaigns:data},null,1):csv(filt());$("#tx").value=s;try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([s],{type:t==="json"?"application/json":"text/csv"}));a.download="tbs-campaigns-"+new Date().toISOString().slice(0,10)+"."+t;a.click()}catch(e){}}
function copyT(){const x=$("#tx");x.select();try{navigator.clipboard.writeText(x.value);toast("Copied")}catch(e){document.execCommand("copy");toast("Copied")}}
async function restore(){let j;try{j=JSON.parse($("#tx").value);if(!Array.isArray(j.campaigns))throw 0}catch(e){return toast("Invalid backup: nothing was changed.")}
const{error}=await sb.from("campaigns").upsert(j.campaigns.map(toRow));if(error)return toast("Error: "+error.message);await loadAll();toast(j.campaigns.length+" campaign(s) restored or updated")}
async function demo(){if(data.some(c=>c.name==="B Learnif"))return toast("B Learnif is already in the list.");const d=[
{name:"B Learnif",objective:"Traffic",product:"Digital product (name to be confirmed)",status:"Completed",start:"2026-06-30",end:"2026-09-04",location:"Côte d’Ivoire",audience:"Large Target",budget:10000,currency:"XAF",period:"Weekly",spend:null,reach:null,impressions:null,clicks:null,messages:null,leads:null,sales:null,rStart:"",rEnd:"",source:"",notes:"Meta campaign ID: 1345734207754263. Actual spend and results were not supplied."}];
for(const c of d){if(!await upsert({...c},true))return}toast("B Learnif campaign added");go("list")}
const cfg=window.TBS_CONFIG||{};let sb;
const DBM={start:"start_date",end:"end_date",rStart:"r_start",rEnd:"r_end"},NUM=["budget","spend",...MET.map(m=>m[0])],DBK=COLS.slice(0,-3);
const toRow=c=>{const o={};DBK.forEach(k=>{const v=c[k];o[DBM[k]||k]=v===""||v===undefined?null:v});return o};
const fromRow=r=>{const o={};DBK.forEach(k=>{const v=r[DBM[k]||k];o[k]=NUM.includes(k)?v:(v??"")});o.created=r.created_at;o.updated=r.updated_at;o.by=r.updated_by||"";return o};
async function loadAll(){const{data:r,error}=await sb.from("campaigns").select("*").order("created_at");if(error)return toast("Error: "+error.message);data=r.map(fromRow)}
async function upsert(c,isNew){for(let t=0;t<3;t++){if(isNew)c.id=nextId();const q=sb.from("campaigns");const{error}=await(isNew?q.insert(toRow(c)):q.upsert(toRow(c)));if(!error){await loadAll();return true}if(isNew&&error.code==="23505"){await loadAll();continue}toast("Error: "+error.message);return false}return false}
function login(msg){$("#who").innerHTML="";$("#nav").innerHTML="";$("#main").innerHTML=`<div class="hero"><div class="logo"><img src="${LOGO}" alt="TBS SARL logo"></div><h2>Welcome to TBS Campaign Monitoring</h2><p>Plan, record and compare your Facebook and Instagram ad campaigns.</p><div class="cd"><div class="ft"><i>📝</i><div><b>Record</b><div class="sub">Budget, audience and verified results of each campaign</div></div></div><div class="ft"><i>✅</i><div><b>Stay accurate</b><div class="sub">Entries are checked, and missing data is never counted as zero</div></div></div><div class="ft"><i>📊</i><div><b>Compare</b><div class="sub">Summaries by period, currency and objective</div></div></div></div><div class="cd"><h2>Sign in</h2>${msg?'<div class="msg">'+esc(msg)+"</div>":""}<label>Email</label><input id="em" type="email" autocomplete="username"><label style="margin-top:10px">Password</label><input id="pw" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"><div style="margin-top:14px"><button class="b p" style="width:100%" onclick="doLogin()">Sign in</button></div><div class="sub" style="margin-top:10px;text-align:center">Accounts are created by the administrator.</div></div></div>`}
async function doLogin(){const{error}=await sb.auth.signInWithPassword({email:$("#em").value.trim(),password:$("#pw").value});if(error)return login("Invalid email or password.");boot()}
async function boot(){const{data:s}=await sb.auth.getSession();if(!s.session)return login();
const{data:p}=await sb.from("profiles").select("role").eq("id",s.session.user.id).maybeSingle();
if(!p||!ROLES[p.role]){await sb.auth.signOut();return login("Account awaiting activation: please contact the administrator.")}
role=p.role;await loadAll();$("#who").innerHTML=esc(s.session.user.email)+" · "+ROLES[role]+' <button class="b" onclick="sb.auth.signOut().then(()=>{data=[];login()})">Sign out</button>';go("list")}
if(!cfg.SUPABASE_URL||cfg.SUPABASE_URL.includes("YOUR")){$("#main").innerHTML='<div class="msg">Fill in config.js first (see README.md).</div>'}else{sb=supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);boot()}
</script></body></html>
